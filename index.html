<!DOCTYPE html>
<html lang="zh-CN" data-canvas-width="480" data-canvas-height="1600">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>哈利波特人格测试</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%231a1230'/%3E%3Cpath d='M20 44 Q14 32 20 20 L30 26 L32 14 L34 26 L44 20 Q50 32 44 44 Q32 52 20 44Z' fill='%23e8b64c'/%3E%3Ccircle cx='26' cy='30' r='4' fill='%231a1230'/%3E%3Ccircle cx='38' cy='30' r='4' fill='%231a1230'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Cinzel:wght@600;700;900&family=Noto+Serif+SC:wght@400;600;700;900&display=swap">
<style>
/* ===== 基础与色板 ===== */
:root{
  --ink:#19122e;
  --night:#241740;
  --night2:#2e1e4e;
  --parch:#f2e4c6;
  --parch-deep:#dcc79c;
  --parch-line:#c3a878;
  --gold:#e8b64c;
  --gold-bright:#f7dd8a;
  --gold-deep:#b07a24;
  --ember:#c87f3d;
  --moss:#33543f;
  --crimson:#8c2f39;
  --text-main:#3a2c17;
  --text-soft:#6b5636;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Noto Serif SC","Songti SC",SimSun,serif;
  background:
    radial-gradient(1200px 600px at 50% -10%, #3a2a5e 0%, transparent 60%),
    radial-gradient(900px 500px at 85% 110%, #27463a 0%, transparent 55%),
    linear-gradient(160deg, var(--night) 0%, var(--ink) 55%, #120d20 100%);
  color:var(--parch);
  min-height:100vh;
  line-height:1.7;
  position:relative;
  overflow-x:hidden;
}
/* 星空背景 */
.stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.stars i{position:absolute;border-radius:50%;background:var(--gold-bright);opacity:.7;animation:twinkle 4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:.85;transform:scale(1.15)}}
.page{position:relative;z-index:1;max-width:520px;margin:0 auto;min-height:100vh;padding:24px 20px 40px;display:flex;flex-direction:column}
.view{display:none}
.view.active{display:block}

/* ===== 通用组件 ===== */
.btn-magic{
  display:inline-block;
  font-family:inherit;
  font-size:18px;
  font-weight:700;
  color:var(--ink);
  background:linear-gradient(180deg,var(--gold-bright),var(--gold) 55%,var(--gold-deep));
  border:2px solid #f6e2a8;
  border-radius:999px;
  padding:14px 42px;
  cursor:pointer;
  box-shadow:0 6px 0 var(--gold-deep),0 12px 24px rgba(0,0,0,.35);
  transition:transform .12s ease,box-shadow .12s ease;
  letter-spacing:.12em;
}
.btn-magic:active{transform:translateY(4px);box-shadow:0 2px 0 var(--gold-deep),0 6px 14px rgba(0,0,0,.3)}
.btn-ghost{
  font-family:inherit;font-size:14px;font-weight:600;
  color:var(--gold);background:transparent;border:1px solid rgba(232,182,76,.55);
  border-radius:999px;padding:10px 26px;cursor:pointer;letter-spacing:.08em;
  transition:background .15s ease;
}
.btn-ghost:hover{background:rgba(232,182,76,.12)}
.muted{color:rgba(242,228,198,.6);font-size:12px}

/* ===== 封面 ===== */
#cover{text-align:center;padding-top:6vh}
.owl-wrap{position:relative;height:150px;margin-bottom:8px}
.owl{position:absolute;left:50%;top:10px;transform:translateX(-50%);animation:float 5s ease-in-out infinite;filter:drop-shadow(0 10px 18px rgba(0,0,0,.45))}
@keyframes float{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-10px)}}
.title-block{margin:6px 0 18px}
.kicker{font-family:"Cinzel",serif;font-size:13px;letter-spacing:.5em;color:var(--gold);text-transform:uppercase;opacity:.9;margin-bottom:10px}
.hero-title{
  font-family:"Cinzel","Noto Serif SC",serif;
  font-size:52px;
  font-weight:900;
  line-height:1.15;
  background:linear-gradient(180deg,#fff3cf 0%,var(--gold-bright) 30%,var(--gold) 55%,var(--gold-deep) 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  filter:drop-shadow(0 2px 0 #7a5517) drop-shadow(0 5px 10px rgba(0,0,0,.55));
  letter-spacing:.06em;
}
.hero-sub{margin-top:14px;font-size:16px;color:var(--parch);opacity:.92;letter-spacing:.2em}
.hero-sub em{font-style:normal;color:var(--gold-bright)}
.start-area{margin:40px 0 30px}
.note-legal{margin-top:26px;opacity:.55}
.castle{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:520px;pointer-events:none;z-index:0;opacity:.5}
.castle svg{width:100%;display:block}

/* ===== 答题 ===== */
.quiz-top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.quiz-count{font-family:"Cinzel",serif;font-size:14px;color:var(--gold);white-space:nowrap;letter-spacing:.05em}
.progress{flex:1;height:14px;border-radius:999px;background:rgba(242,228,198,.14);border:1px solid rgba(232,182,76,.35);overflow:hidden}
.progress-fill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,var(--gold-deep),var(--gold),var(--gold-bright));transition:width .4s ease}
.quiz-card{
  background:
    radial-gradient(220px 120px at 12% 0%, rgba(255,248,224,.55), transparent 60%),
    linear-gradient(170deg,#f7ecd2 0%,var(--parch) 60%,#e8d6ac 100%);
  color:var(--text-main);
  border-radius:20px;
  border:1px solid var(--parch-line);
  box-shadow:0 16px 40px rgba(0,0,0,.4), inset 0 0 60px rgba(180,140,70,.18);
  padding:26px 22px 24px;
  position:relative;
}
.quiz-card::before{
  content:"";position:absolute;inset:8px;border:1px solid rgba(176,122,36,.35);border-radius:14px;pointer-events:none;
}
.q-tag{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--gold-deep);font-weight:700;letter-spacing:.1em;margin-bottom:12px}
.q-tag .glyph{font-family:"Cinzel",serif;color:var(--ember)}
.q-text{font-size:19px;font-weight:700;line-height:1.75;margin-bottom:22px;min-height:66px}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{
  font-family:inherit;text-align:left;font-size:15.5px;color:var(--text-main);
  background:rgba(255,252,240,.65);
  border:1.5px solid var(--parch-line);
  border-radius:14px;
  padding:13px 16px;
  cursor:pointer;
  transition:border-color .15s ease,background .15s ease,transform .1s ease;
  position:relative;
}
.opt:hover{border-color:var(--gold-deep);background:rgba(255,250,228,.95);transform:translateX(3px)}
.opt:active{transform:scale(.99)}
.opt .opt-letter{
  display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;
  font-family:"Cinzel",serif;font-weight:700;font-size:13px;color:var(--gold-deep);
  border:1px solid var(--gold-deep);border-radius:50%;margin-right:10px;flex:none;
}
.quiz-footer{text-align:center;margin-top:26px}

/* ===== 结果 ===== */
#result .result-head{text-align:center;margin-bottom:22px}
.result-head .res-kicker{font-family:"Cinzel",serif;font-size:13px;letter-spacing:.42em;color:var(--gold);text-transform:uppercase;margin-bottom:8px}
.result-head h2{font-size:34px;font-weight:900;letter-spacing:.08em;color:var(--gold-bright);text-shadow:0 3px 0 rgba(0,0,0,.35)}
.char-card{
  text-align:center;
  background:linear-gradient(170deg,#f7ecd2,var(--parch) 65%,#e6d3a6);
  color:var(--text-main);
  border-radius:22px;
  border:1px solid var(--parch-line);
  box-shadow:0 18px 44px rgba(0,0,0,.45), inset 0 0 70px rgba(180,140,70,.16);
  padding:26px 20px 22px;
  margin-bottom:20px;
  position:relative;
  overflow:hidden;
}
.char-card .gold-frame{
  width:min(78%,260px);aspect-ratio:1/1;margin:0 auto 16px;border-radius:18px;overflow:hidden;
  border:3px solid var(--gold);box-shadow:0 8px 0 var(--gold-deep),0 14px 26px rgba(0,0,0,.35);
}
.char-card .gold-frame img{width:100%;height:100%;object-fit:cover;display:block}
.char-name{font-size:27px;font-weight:900;color:var(--ink);letter-spacing:.06em}
.char-title{font-size:15px;font-weight:700;color:var(--crimson);margin-top:2px;letter-spacing:.08em}
.char-slogan{font-size:14px;color:var(--text-soft);font-style:italic;margin-top:8px}
.sec{
  background:rgba(36,23,64,.55);
  border:1px solid rgba(232,182,76,.28);
  border-radius:18px;
  padding:20px;
  margin-bottom:16px;
}
.sec h3{
  font-size:16px;color:var(--gold-bright);letter-spacing:.18em;margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
}
.sec h3::before{content:"";width:14px;height:2px;background:var(--gold);flex:none}
.sec p{font-size:14.5px;color:rgba(242,228,198,.92)}
.tag-wall{display:flex;flex-wrap:wrap;gap:8px}
.tag{
  font-size:13px;color:var(--ink);background:linear-gradient(180deg,var(--gold-bright),var(--gold));
  border-radius:999px;padding:5px 14px;font-weight:700;letter-spacing:.05em;
}
.duel{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.duel .box{border-radius:14px;padding:14px}
.duel .good{background:rgba(51,84,63,.5);border:1px solid rgba(150,200,160,.35)}
.duel .bad{background:rgba(140,47,57,.42);border:1px solid rgba(220,120,120,.32)}
.duel h4{font-size:13.5px;letter-spacing:.1em;margin-bottom:8px}
.duel .good h4{color:#9ed4a8}
.duel .bad h4{color:#f0a0a0}
.duel ul{list-style:none;display:flex;flex-direction:column;gap:7px}
.duel li{font-size:13.5px;color:rgba(242,228,198,.92);padding-left:18px;position:relative}
.duel .good li::before{content:"✦";position:absolute;left:0;color:#9ed4a8}
.duel .bad li::before{content:"✧";position:absolute;left:0;color:#f0a0a0}
.path-list{display:flex;flex-direction:column;gap:12px}
.path-item{background:rgba(242,228,198,.07);border-left:3px solid var(--gold);border-radius:10px;padding:12px 14px}
.path-item b{color:var(--gold-bright);font-size:14.5px}
.path-item p{font-size:13.5px;color:rgba(242,228,198,.85);margin-top:3px}
.advice-list{display:flex;flex-direction:column;gap:10px}
.advice-item{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:rgba(242,228,198,.92)}
.advice-item .num{flex:none;width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%;background:var(--gold);color:var(--ink);font-weight:900;font-size:13px;font-family:"Cinzel",serif}
.actions{text-align:center;margin-top:24px;display:flex;flex-direction:column;gap:12px;align-items:center}
.result-legal{margin-top:18px;text-align:center}
.combo-tip{
  margin-top:14px;font-size:13.5px;color:var(--gold);border:1px dashed rgba(232,182,76,.5);
  border-radius:12px;padding:10px 12px;background:rgba(232,182,76,.06);
}

/* ===== 桌面适配 ===== */
@media (min-width:768px){
  .page{max-width:620px;padding-top:32px}
  .hero-title{font-size:64px}
  .q-text{font-size:20px}
  .char-card .gold-frame{width:min(70%,300px)}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .opt{min-height:64px}
}
@media (prefers-reduced-motion:reduce){
  .owl,.stars i{animation:none}
}
</style>
</head>
<body>
<div class="stars" id="stars" aria-hidden="true"></div>
<div class="castle" aria-hidden="true">
  <svg viewBox="0 0 520 120" preserveAspectRatio="xMidYMax slice">
    <path d="M0 120 L0 70 L30 70 L30 45 L60 45 L60 70 L90 70 L90 40 L120 40 L120 70 L150 70 L150 55 L180 55 L180 70 L210 70 L210 35 L240 35 L240 70 L270 70 L270 50 L300 50 L300 70 L330 70 L330 38 L360 38 L360 70 L390 70 L390 52 L420 52 L420 70 L450 70 L450 42 L480 42 L480 70 L520 70 L520 120 Z" fill="#120d20"/>
    <path d="M20 70 L20 60 L30 60 L30 70 Z M40 70 L40 58 L50 58 L50 70 Z M60 70 L60 62 L70 62 L70 70 Z" fill="#1d1430"/>
    <path d="M0 120 L0 105 Q40 96 80 105 T160 105 T240 105 T320 105 T400 105 T480 105 T520 105 L520 120 Z" fill="#0d0918"/>
  </svg>
</div>

<div class="page">

  <!-- ===== 视图：封面 ===== -->
  <section id="cover" class="view active">
    <div class="owl-wrap">
      <svg class="owl" width="120" height="120" viewBox="0 0 120 120" aria-hidden="true">
        <ellipse cx="60" cy="66" rx="36" ry="42" fill="#241740" stroke="#e8b64c" stroke-width="2.5"/>
        <ellipse cx="60" cy="40" rx="26" ry="22" fill="#2e1e4e" stroke="#e8b64c" stroke-width="2.5"/>
        <circle cx="47" cy="38" r="7.5" fill="#f2e4c6"/>
        <circle cx="73" cy="38" r="7.5" fill="#f2e4c6"/>
        <circle cx="47" cy="38" r="3.4" fill="#19122e"/>
        <circle cx="73" cy="38" r="3.4" fill="#19122e"/>
        <path d="M38 48 L26 42 L36 56 Z" fill="#e8b64c"/>
        <path d="M82 48 L94 42 L84 56 Z" fill="#e8b64c"/>
        <path d="M40 74 Q24 84 16 76 Q26 90 44 88 Q50 84 48 76 Z" fill="#241740" stroke="#e8b64c" stroke-width="2"/>
        <path d="M80 74 Q96 84 104 76 Q94 90 76 88 Q70 84 72 76 Z" fill="#241740" stroke="#e8b64c" stroke-width="2"/>
        <path d="M60 66 L60 76 M54 78 L60 88 L66 78 Z" fill="#e8b64c"/>
        <ellipse cx="60" cy="80" rx="10" ry="6" fill="#f2e4c6"/>
      </svg>
    </div>
    <div class="title-block">
      <div class="kicker">Wizarding Personality</div>
      <h1 class="hero-title">哈利波特</h1>
      <p class="hero-sub">测出你灵魂深处的<em>魔法人格</em></p>
    </div>
    <div class="start-area">
      <button class="btn-magic" onclick="location.hash='#quiz'">进入魔法测试</button>
    </div>
    <p class="note-legal muted">非官方粉丝向 · 仅供娱乐</p>
  </section>

  <!-- ===== 视图：答题 ===== -->
  <section id="quiz" class="view">
    <div class="quiz-top">
      <span class="quiz-count" id="quizCount">1 / 50</span>
      <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="quiz-card" id="quizCard"></div>
    <div class="quiz-footer"><span class="muted">凭第一直觉作答，别回头改</span></div>
  </section>

  <!-- ===== 视图：结果 ===== -->
  <section id="result" class="view">
    <div id="resultBox"></div>
  </section>

  <!-- ===== 角色图静态源（发布链路识别，JS渲染时克隆引用） ===== -->
  <div id="charImgs" hidden>
    <img src="role-harry.jpg" data-key="harry" alt="哈利·波特">
    <img src="role-hermione.jpg" data-key="hermione" alt="赫敏·格兰杰">
    <img src="role-ron.jpg" data-key="ron" alt="罗恩·韦斯莱">
    <img src="role-dumbledore.jpg" data-key="dumbledore" alt="邓布利多">
    <img src="role-snape.jpg" data-key="snape" alt="斯内普">
    <img src="role-mcgonagall.jpg" data-key="mcgonagall" alt="麦格教授">
    <img src="role-luna.jpg" data-key="luna" alt="卢娜·洛夫古德">
    <img src="role-sirius.jpg" data-key="sirius" alt="小天狼星">
  </div>

</div>

<script>
"use strict";
/* ===== 数据：题目（50题，每题4选项映射8角色）===== */
var QUESTIONS = [
  { q:"分院帽犹豫不决，它低声问：你最渴望成为什么样的人？", opts:[
    {t:"敢于为朋友挺身而出的人",c:"harry"},
    {t:"什么都懂一点的人",c:"hermione"},
    {t:"有朋友陪着就很好的人",c:"ron"},
    {t:"能看清全局的人",c:"dumbledore"}]},
  { q:"第一堂魔药课，教授当众刁难你，你会怎么做？", opts:[
    {t:"小声抱怨两句，但还是照做",c:"ron"},
    {t:"平静地看穿他的用意",c:"dumbledore"},
    {t:"记住这笔账，以后赢回来",c:"snape"},
    {t:"不卑不亢，按规矩完成",c:"mcgonagall"}]},
  { q:"深夜经过禁林，忽然听到奇怪的声响，你？", opts:[
    {t:"保持警惕，不露声色地观察",c:"snape"},
    {t:"先报告教授，按规矩处理",c:"mcgonagall"},
    {t:"闭上眼，听它想说什么",c:"luna"},
    {t:"提上魔杖，直接去看个究竟",c:"sirius"}]},
  { q:"图书馆里发现一本会骂人的魔法书，你？", opts:[
    {t:"蹲下来跟它聊起来",c:"luna"},
    {t:"想办法撬开书脊看看秘密",c:"sirius"},
    {t:"护住它，别让管理员毁掉它",c:"harry"},
    {t:"研究它为什么会骂人，写篇论文",c:"hermione"}]},
  { q:"魁地奇院队选拔，你更想站在哪个位置？", opts:[
    {t:"追球手，冲在最前面",c:"harry"},
    {t:"找球手，算准金色飞贼的轨迹",c:"hermione"},
    {t:"守门员，相对轻松点",c:"ron"},
    {t:"队长，统筹全场节奏",c:"dumbledore"}]},
  { q:"好朋友半夜拉你翻墙去禁林探险，你？", opts:[
    {t:"嘴上嫌麻烦，还是跟着去了",c:"ron"},
    {t:"劝他别去，但暗中留好后手",c:"dumbledore"},
    {t:"不动声色跟着，盯紧每一处危险",c:"snape"},
    {t:"先问他有没有给教授留字条",c:"mcgonagall"}]},
  { q:"期末魔咒考试，旁边的同学偷偷抄你的答案，你？", opts:[
    {t:"假装没看见，但记住了这件事",c:"snape"},
    {t:"举手报告，考场纪律不容破坏",c:"mcgonagall"},
    {t:"无所谓，考试本来就不重要",c:"luna"},
    {t:"抄呗，兄弟有难同当",c:"sirius"}]},
  { q:"霍格沃茨大战前夜，你选择守在哪里？", opts:[
    {t:"相信直觉，去守最安静的桥",c:"luna"},
    {t:"冲在第一线，挡在最前面",c:"sirius"},
    {t:"守在弱小同学身边，挡下致命一击",c:"harry"},
    {t:"连夜分析敌方布防，制定战术",c:"hermione"}]},
  { q:"朋友被冤枉偷了东西，你的第一反应是？", opts:[
    {t:"站出来替他作证",c:"harry"},
    {t:"收集证据，证明他的清白",c:"hermione"},
    {t:"陪他散心，一起骂骂咧咧",c:"ron"},
    {t:"相信他，并暗中帮他布局翻盘",c:"dumbledore"}]},
  { q:"你发现自己有变成动物的天赋，最想学哪种？", opts:[
    {t:"学个轻松可爱的就行",c:"ron"},
    {t:"学最复杂的那种，挑战自己",c:"dumbledore"},
    {t:"偷偷学，不让任何人知道",c:"snape"},
    {t:"先查清楚校规允不允许",c:"mcgonagall"}]},
  { q:"霍格莫德村新开了一家魔法糖果店，你会？", opts:[
    {t:"先研究每种糖果的成分配方",c:"snape"},
    {t:"试吃后给出理性的评价",c:"mcgonagall"},
    {t:"尝尝那款会唱歌的糖",c:"luna"},
    {t:"把每种都买来，分给大家",c:"sirius"}]},
  { q:"你当选了学生会主席，上任第一件事是？", opts:[
    {t:"给每个新生写一封欢迎信",c:"luna"},
    {t:"改革校规里那些老规矩",c:"sirius"},
    {t:"组建互助小组，照顾落单的人",c:"harry"},
    {t:"建立学习资料共享库",c:"hermione"}]},
  { q:"黑魔法防御课教了一个危险的咒语，你？", opts:[
    {t:"认真学，关键时刻要用得上",c:"harry"},
    {t:"先查清它全部的后果再说",c:"hermione"},

/* ===== 角色基础信息 ===== */
var CHARACTERS = {
  harry:      { name:"哈利·波特" },
  hermione:   { name:"赫敏·格兰杰" },
  ron:        { name:"罗恩·韦斯莱" },
  dumbledore: { name:"邓布利多" },
  snape:      { name:"斯内普" },
  mcgonagall: { name:"麦格教授" },
  luna:       { name:"卢娜·洛夫古德" },
  sirius:     { name:"小天狼星" }
};

/* ===== 状态 ===== */
var state = { idx:0, scores:{} };

/* ===== 计分与渲染 ===== */
function pick(roleKey){
  state.scores[roleKey] = (state.scores[roleKey]||0) + 1;
  state.idx++;
  if(state.idx >= QUESTIONS.length){ showResult(); location.hash = "#result"; }
  else { renderQuiz(); }
}

function renderQuiz(){
  var q = QUESTIONS[state.idx];
  document.getElementById("quizCount").textContent = (state.idx+1) + " / " + QUESTIONS.length;
  document.getElementById("progressFill").style.width = (state.idx / QUESTIONS.length * 100) + "%";
  var letters = ["A","B","C","D"];
  var html = '<div class="q-tag"><span class="glyph">✦</span>第 ' + (state.idx+1) + ' 道魔法谜题</div>';
  html += '<div class="q-text">' + q.q + '</div>';
  html += '<div class="opts">';
  for(var i=0;i<q.opts.length;i++){
    html += '<button class="opt" onclick="pick(\'' + q.opts[i].c + '\')"><span class="opt-letter">' + letters[i] + '</span>' + q.opts[i].t + '</button>';
  }
  html += '</div>';
  document.getElementById("quizCard").innerHTML = html;
}

function topRoles(){
  var arr = [];
  for(var k in state.scores){ arr.push({k:k, v:state.scores[k]}); }
  arr.sort(function(a,b){ return b.v - a.v; });
  return arr;
}

function showResult(){
  var arr = topRoles();
  var first = arr[0], second = arr[1];
  var both = (second && second.v === first.v) ? [first.k, second.k] : [first.k];
  var html = '<div class="result-head"><div class="res-kicker">Your Magic Persona</div><h2>你的魔法人格是</h2></div>';
  for(var i=0;i<both.length;i++){
    html += renderCharCard(both[i]);
  }
  if(both.length === 2){
    html += '<div class="combo-tip">双人格共鸣：你是 <b>' + CHARACTERS[both[0]].name + '</b> 与 <b>' + CHARACTERS[both[1]].name + '</b> 的结合体——两者的力量在你体内并存。</div>';
  }
  html += '<div class="actions"><button class="btn-magic" onclick="restart()">再测一次</button><button class="btn-ghost" onclick="location.hash=\'#cover\'">返回首页</button></div>';
  html += '<p class="result-legal muted">非官方粉丝向 · 结果仅供娱乐 · 角色图片来源于网络</p>';
  document.getElementById("resultBox").innerHTML = html;
}

function renderCharCard(key){
  var c = CHARACTERS[key], d = DETAILS[key];
  if(!d){ d = { title:"", slogan:"", portrait:"", traits:[], good:[], bad:[], paths:[], advice:[] }; }
  var html = '<div class="char-card">';
  var srcImg = document.querySelector('#charImgs img[data-key="' + key + '"]');
  html += '<div class="gold-frame">' + (srcImg ? srcImg.outerHTML : '') + '</div>';
  html += '<div class="char-name">' + c.name + '</div>';
  html += '<div class="char-title">' + d.title + '</div>';
  html += '<div class="char-slogan">' + d.slogan + '</div>';
  html += '</div>';

  html += '<div class="sec"><h3>人格画像</h3><p>' + d.portrait + '</p></div>';

  html += '<div class="sec"><h3>核心特质</h3><div class="tag-wall">';
  for(var i=0;i<d.traits.length;i++){ html += '<span class="tag">' + d.traits[i] + '</span>'; }
  html += '</div></div>';

  html += '<div class="sec"><h3>天生优势 × 易踩的坑</h3><div class="duel">';
  html += '<div class="box good"><h4>✦ 天生优势</h4><ul>';
  for(var g=0;g<d.good.length;g++){ html += '<li>' + d.good[g] + '</li>'; }
  html += '</ul></div>';
  html += '<div class="box bad"><h4>✧ 易踩的坑</h4><ul>';
  for(var b=0;b<d.bad.length;b++){ html += '<li>' + d.bad[b] + '</li>'; }
  html += '</ul></div></div></div>';

  html += '<div class="sec"><h3>你的魔法道路</h3><div class="path-list">';
  for(var p=0;p<d.paths.length;p++){ html += '<div class="path-item"><b>' + d.paths[p][0] + '</b><p>' + d.paths[p][1] + '</p></div>'; }
  html += '</div></div>';

  html += '<div class="sec"><h3>成长建议</h3><div class="advice-list">';
  for(var a=0;a<d.advice.length;a++){ html += '<div class="advice-item"><span class="num">' + (a+1) + '</span><span>' + d.advice[a] + '</span></div>'; }
  html += '</div></div>';
  return html;
}

function restart(){
  state.idx = 0; state.scores = {};
  document.getElementById("quizCount").textContent = "1 / " + QUESTIONS.length;
  document.getElementById("progressFill").style.width = "0%";
  location.hash = "#quiz";
  renderQuiz();
}

/* ===== 路由 ===== */
function route(){
  var h = location.hash || "#cover";
  document.getElementById("cover").classList.toggle("active", h === "#cover");
  document.getElementById("quiz").classList.toggle("active", h === "#quiz");
  document.getElementById("result").classList.toggle("active", h === "#result");
  if(h === "#quiz"){ renderQuiz(); }
  if(h === "#result"){ showResult(); }
}
window.addEventListener("hashchange", route);
route();

/* ===== 星空生成 ===== */
(function(){
  var s = document.getElementById("stars");
  var html = "";
  for(var i=0;i<46;i++){
    var x = Math.random()*100, y = Math.random()*100, d = (Math.random()*3+1.5).toFixed(1), t = (Math.random()*4).toFixed(1), r = (Math.random()*1.8+1).toFixed(1);
    html += '<i style="left:' + x.toFixed(1) + '%;top:' + y.toFixed(1) + '%;width:' + r + 'px;height:' + r + 'px;animation-delay:' + t + 's;animation-duration:' + d + 's"></i>';
  }
  s.innerHTML = html;
})();
</script>
</body>
</html>
